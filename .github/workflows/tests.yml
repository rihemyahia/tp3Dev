
name: Python Tests

on:
  push:
    branches:
      - main
      - feature/soustraction-with-unit-tests
  pull_request:
    branches:
      - main

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pylint
        run: python -m pip install pylint

      - name: Run Pylint
        run: pylint main.py

  run-test:
    needs: pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install fastapi "uvicorn[standard]" pytest httpx

      - name: Run unit tests
        run: pytest -v --junitxml=report.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml

  calculate-coverage:
    needs: pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install fastapi "uvicorn[standard]" pytest httpx pytest-cov

      - name: Calculate code coverage
        run: pytest -v --cov=main --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
